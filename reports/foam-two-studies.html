<style>
/* ============ tokens: document = paper, deck = stage ============ */
:root{
  --paper:#F2F4F3; --surface:#FBFCFC; --surface-2:#EAEEEC;
  --ink:#16201F; --ink-2:#4A5654; --ink-3:#77837F;
  --rule:#D6DDDA; --prior:#5A54A6; --prior-wash:#EDECF7;
  --now:#0E7C6B; --now-wash:#E4F0ED; --warn:#A8501E;
  --shadow:0 1px 2px rgba(22,32,31,.05), 0 8px 24px rgba(22,32,31,.045);
  --font-d:"LatinDisplay",Georgia,serif;
  --font-b:"LatinBody",system-ui,sans-serif;
  --font-m:"LatinMono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1514; --surface:#161E1D; --surface-2:#1D2725;
    --ink:#E9EEEC; --ink-2:#A6B3B0; --ink-3:#7E8C89;
    --rule:#2A3532; --prior:#A39CF0; --prior-wash:#1E1E33;
    --now:#4FC6AE; --now-wash:#122723; --warn:#E09763;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1514; --surface:#161E1D; --surface-2:#1D2725;
  --ink:#E9EEEC; --ink-2:#A6B3B0; --ink-3:#7E8C89;
  --rule:#2A3532; --prior:#A39CF0; --prior-wash:#1E1E33;
  --now:#4FC6AE; --now-wash:#122723; --warn:#E09763;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-b);
  font-size:16px; line-height:1.78; -webkit-font-smoothing:antialiased;
}
body.mode-deck{overflow:hidden}

/* ============ app bar ============ */
.appbar{
  position:sticky; top:0; z-index:200; height:54px;
  display:flex; align-items:center; gap:16px;
  padding:0 clamp(16px,4vw,60px);
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);
}
body.mode-deck .appbar{background:#0B1211; border-bottom-color:#22302E}
body.mode-deck .appbar .brand{color:#6C7D79}
body.mode-deck .seg{border-color:#22302E}
body.mode-deck .seg button{color:#9FB0AC}
body.mode-deck .seg button[aria-pressed="true"]{background:#1D2725; color:#EAF1EF}
.brand{
  font-family:var(--font-m); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; margin-right:auto; overflow:hidden; text-overflow:ellipsis;
}
.seg{display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; flex:0 0 auto}
.seg button{
  font-family:var(--font-m); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  padding:6px 11px; border:0; background:transparent; color:var(--ink-2); cursor:pointer; white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); font-weight:500}
.seg button:focus-visible{outline:2px solid var(--now); outline-offset:-2px}

/* ============ view switching ============ */
.view{display:none}
.view.on{display:block}

/* ============ DOCUMENT ============ */
.wrap{max-width:1160px; margin:0 auto; padding:0 clamp(18px,4vw,24px)}
.dnav{position:sticky; top:54px; z-index:60; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--rule)}
.dnav .wrap{display:flex; gap:4px; overflow-x:auto; height:46px; align-items:center; scrollbar-width:none}
.dnav .wrap::-webkit-scrollbar{display:none}
.dnav a{font-size:13px; color:var(--ink-2); text-decoration:none; white-space:nowrap; padding:5px 9px; border-radius:5px}
.dnav a:hover{background:var(--surface-2); color:var(--ink)}
.dnav a:focus-visible{outline:2px solid var(--now); outline-offset:1px}

header.hero{padding:clamp(40px,7vw,72px) 0 40px; border-bottom:1px solid var(--rule)}

/* ============ DECK ============ */
.deckroot{
  --stage:#0B1211; --stage-2:#111A19; --panel:#0E1716;
  --ink:#EAF1EF; --ink-2:#9FB0AC; --ink-3:#6C7D79; --rule:#22302E;
  --prior:#A39CF0; --now:#4FC6AE; --warn:#E8945C;
  position:relative; width:100%; height:calc(100svh - 54px); overflow:hidden;
  background:var(--stage); color:var(--ink);
}
.slide{position:absolute; inset:0; display:flex; flex-direction:column;
  padding:clamp(18px,3vw,44px) clamp(18px,4vw,60px) calc(78px + env(safe-area-inset-bottom,0px));
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  opacity:0; visibility:hidden; transform:translateY(14px);
  transition:opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1), visibility .5s}
.slide.on{opacity:1; visibility:visible; transform:none}
.chip{display:inline-block; font-family:var(--font-m); font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3); border:1px solid var(--rule); border-radius:999px;
  padding:4px 11px; margin-bottom:clamp(10px,1.4vh,16px); align-self:flex-start}
.slide h1{font-family:var(--font-d); font-weight:700; margin:0; font-size:clamp(24px,3.6vw,46px);
  line-height:1.24; letter-spacing:-.02em; text-wrap:balance; max-width:none}
.slide h1 .hl{color:var(--now)} .slide h1 .hp{color:var(--prior)} .slide h1 .hw{color:var(--warn)}
.slide .sub{color:var(--ink-2); font-weight:400; margin:12px 0 0;
  font-size:clamp(13.5px,1.2vw,17px); line-height:1.62; max-width:58em}
.slide .sub b{color:var(--ink); font-weight:600}
.figs{display:flex; gap:clamp(12px,1.6vw,22px); margin-top:clamp(14px,2vh,24px); flex:0 0 auto}
.fig{display:flex; flex-direction:column; flex:1 1 0; min-width:0; min-height:fit-content;
  background:var(--panel); border:1px solid var(--rule); border-radius:13px; overflow:hidden; margin:0}
.fig.p{border-top:2px solid var(--prior)} .fig.n{border-top:2px solid var(--now)} .fig.w{border-top:2px solid var(--warn)}
.fig-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:9px 14px; background:var(--stage-2); border-bottom:1px solid var(--rule)}
.fig-head .ft{font-family:var(--font-m); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.fig.p .fig-head .ft{color:var(--prior)} .fig.n .fig-head .ft{color:var(--now)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--font-m); font-size:10.5px; color:var(--ink-3)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:8px; height:8px; border-radius:50%; display:block}
.kread{font-family:var(--font-m); font-size:clamp(15px,1.5vw,20px); font-weight:500;
  font-variant-numeric:tabular-nums; color:var(--now); transition:color .4s}
.kread.flip{color:var(--warn)}
.fig-canvas{position:relative; flex:0 0 auto; height:clamp(210px,34svh,360px); background:var(--panel)}
.fig-canvas canvas{display:block; width:100%; height:100%}
.fig-foot{padding:11px 15px 13px; background:var(--stage-2); border-top:1px solid var(--rule);
  font-size:13px; line-height:1.55; color:var(--ink-2);
  text-align:left; max-width:none; margin:0}
.fig-foot b{color:var(--ink); font-weight:600}
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.2vw,16px); margin-top:clamp(12px,1.6vh,18px); flex:0 0 auto}
.qcard{background:var(--stage-2); border:1px solid var(--rule); border-radius:11px; padding:13px 16px 15px}
.qcard.p{border-left:3px solid var(--prior)} .qcard.n{border-left:3px solid var(--now)}
.qcard .qk{font-family:var(--font-m); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:5px}
.qcard.p .qk{color:var(--prior)} .qcard.n .qk{color:var(--now)}
.qcard .qt{font-size:clamp(13.5px,1.2vw,17px); line-height:1.5; color:var(--ink); font-weight:500}
.qcard .qg{display:block; margin-top:3px; color:var(--ink-3); font-size:12.5px; font-weight:400}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(9px,1vw,14px); margin-top:clamp(12px,1.6vh,18px); flex:0 0 auto}
.tile{background:var(--stage-2); border:1px solid var(--rule); border-radius:11px; padding:12px 14px 13px}
.tile .tv{font-family:var(--font-m); font-size:clamp(17px,2vw,27px); font-weight:500;
  font-variant-numeric:tabular-nums; line-height:1.15; color:var(--now)}
.tile .tv.warnv{color:var(--warn)}
.tile .tk{font-size:12px; color:var(--ink-2); margin-top:5px; line-height:1.45}
.tile .tk b{color:var(--ink); font-weight:600}
.verdict{margin-top:clamp(11px,1.5vh,17px); padding:13px 18px; border-radius:11px; flex:0 0 auto;
  background:var(--stage-2); border:1px solid var(--rule); border-left:3px solid var(--now);
  font-size:clamp(13px,1.15vw,16.5px); line-height:1.55; color:var(--ink-2)}
.verdict b{color:var(--ink); font-weight:600}
.verdict .pw{color:var(--prior); font-weight:600} .verdict .nw{color:var(--now); font-weight:600}
.controls{position:absolute; left:0; right:0; bottom:0; z-index:20;
  height:calc(56px + env(safe-area-inset-bottom,0px));
  padding:0 clamp(18px,4vw,60px) env(safe-area-inset-bottom,0px);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  border-top:1px solid var(--rule); background:var(--stage-2)}
.dots{display:flex; gap:9px; align-items:center}
.dots button{width:32px; height:4px; border-radius:2px; border:0; padding:0; cursor:pointer;
  background:var(--rule); transition:background .3s}
.dots button[aria-current="true"]{background:var(--now)}
.dots button:focus-visible{outline:2px solid var(--now); outline-offset:3px}
.counter{font-family:var(--font-m); font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.counter b{color:var(--now); font-weight:500}
.hint{font-family:var(--font-m); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.arrows{display:flex; gap:8px}
.arrows button{width:30px; height:30px; border-radius:7px; border:1px solid var(--rule);
  background:transparent; color:var(--ink-2); cursor:pointer; font-size:14px; line-height:1}
.arrows button:hover{color:var(--ink); border-color:var(--ink-3)}
.arrows button:focus-visible{outline:2px solid var(--now); outline-offset:2px}

@media (max-width:860px){
  .cols{grid-template-columns:1fr; gap:18px}

}

}

e a black box that gives an answer while hiding its reasoning, <b>what it learns comes out as an equation a person can read and correct</b>.", "The central invention is a single number, the “information index”, which compresses whether a given spot is poised to grow or shrink in competition with its surroundings into a value between <span class='num'>+1</span> and <span class='num'>−1</span>.", "Much as a weather forecast reduces each city to one pressure reading, they divided the tray into a grid and assigned this index to every cell.", "They learned the rule on an elongated specimen, then applied it unchanged to a <b>circular specimen never used in training</b> to see whether it still worked.", "Average error was about <span class='num'>20%</span> on the elongated specimen and about <span class='num'>5%</span> on the circular one.", "The rule evolved on its own during training, moving from “nearly everything shrinks” to “growth and shrinkage coexist”.", "The authors suggest the rule could one day drive a process that prints foam patterns — a transparent conducting grid, say — without expensive templates."]}, "now": {"en": ["The same kind of system (flat soap foam between glass plates, imaged every 30 or 10 seconds), but the question is not prediction — it is testing.", "What gets tested is the textbook law of foam physics: <b>a bubble with more than six neighbours grows, one with fewer shrinks</b>.", "Across three foam samples (A, C, F) and three time intervals (30, 150 and 600 seconds) — nine combinations in all — the law’s coefficient came out positive, with its confidence interval clear of zero, in every one.", "On sample A the coefficient moved only 2% while the measuring interval stretched twentyfold. Whether it drifts over a foam’s life is still an open question.", "The most valuable part of the project, though, is not that result but <b>the record of a period when the law appeared to fail — and every cause turned out to lie in the measurement</b>.", "Five separate defects manufactured those false failures; one of them — a straight-line fit dominated by a few extreme points — produced a coefficient of −1.74 on one foam, which made the law look exactly backwards.", "All five were caught by checks that work regardless of whether the answer comes out looking right.", "Fourteen frames (about 1,000 bubbles) were labelled by hand as ground truth, so the automatic detector’s accuracy could be scored for the first time.", "Contrary to expectation, the neural network never once beat the simple physics formula — and that failure is reported here along with an explanation of it.", "The deliverable is therefore less “we built a new model” and more <b>a map of what can and cannot be trusted in this experimental system</b>."]}}, {"num": "02", "name": {"en": "The problem"}, "sub": {"en": "Each study's answer to “why does this need doing?” — and the point where their starting positions diverge."}, "plabel": null, "nlabel": null, "prior": {"en": ["Foam is everywhere — food, cosmetics, pharmaceuticals, biotechnology — yet the rules describing how it changes only hold well under carefully controlled laboratory conditions.", "Real foam loses water over time, so <b>its whole character shifts from a “wet” state to a “dry” one</b>.", "By analogy: fresh dough and baked bread are the same ingredients, but nothing about handling one carries over to the other.", "The tidy textbook law assumes dry foam, so covering the wet regime as well demands a far more complicated equation loaded with correction terms.", "But using that equation requires precisely measuring, for every single bubble, <b>how many sides it has</b> and <b>how round it is</b> — painstaking manual work.", "Computer simulations mostly assume the amount of liquid never changes, so they cannot reproduce the full life of the foam from start to finish.", "Conversely, the now-common black-box machine learning may predict well but <b>cannot explain why</b>, which limits its scientific value.", "There was an applied bottleneck too: patterning circuits from foam required first fabricating a template of fine posts, a slow and energy-consuming step.", "So three things were needed at once — <b>few observations</b>, a <b>rule a human can read</b>, covering <b>the whole span from wet to dry</b>.", "The attempt to satisfy all three simultaneously is where this paper begins."]}, "now": {"en": ["The starting point is the opposite one — not prediction, but <b>“can we trust the numbers we are currently measuring?”</b>", "Running the pipeline, the textbook law appeared not to hold; at one point the coefficient read −1.74 and I came close to concluding the law ran backwards here.", "At that moment there are two options: announce that the physics differs, or doubt your own ruler.", "I chose the second, and that choice defined the character of the whole project.", "There were grounds for doubt: the automatic detector was counting the <b>thin channels of pooled liquid between bubbles</b> as bubbles in their own right.", "Those channels sit <b>precisely between genuine neighbours</b>, so they corrupt exactly the neighbour count the law is about.", "A more fundamental problem lurked underneath — <b>nobody had ever scored the detector's accuracy</b>.", "It is the situation of publishing a diet study without ever checking that the scale reads true.", "And one more: neighbour-swap events, which foam physics says are routine, were being detected just once in 198 frames — an implausibly low figure.", "So the question here became not “how does foam change?” but <b>“where is our measuring apparatus lying to us?”</b>"]}}, {"num": "03", "name": {"en": "Method"}, "sub": {"en": "They start from the same photographs, but turn them into numbers in completely different ways."}, "plabel": null, "nlabel": null, "prior": {"en": ["They built the raft with commercial foaming soap on a glass slide and covered it with a matching slide, so only the rim bubbles touch air.", "Two specimens were used — an elongated one (about <span class='num'>16×6 mm</span>) and a circular one (about <span class='num'>9×9 mm</span>).", "Image processing is comparatively plain: crop the blank margin, enlarge threefold, smooth the edges with a blur, then <b>split the image into black and white at a brightness of 127</b> and trace the contours.", "Anything that was not a bubble was removed by “empirically chosen conditions”.", "From here the work turns original — the frame is covered by a <b>fixed grid that never moves</b> (cells of about <span class='num'>0.44 mm</span>, some <span class='num'>900–1,225</span> of them).", "Instead of chasing individual bubbles, they only ask <b>how much bubble perimeter currently sits inside each cell</b> — reading population density by district rather than following people on CCTV.", "Each cell is given a sign for “am I larger or smaller than those around me”, and the neighbours are combined into one number with nearer ones weighted more heavily.", "The same operation is applied along time, but <b>only backwards</b> — the future cannot influence the past.", "The form of the rule was not fixed in advance by a human; it was searched with a <b>genetic algorithm</b> (breeding good candidates over generations — 100,000 candidates across 30 generations) combined with probabilistic updating.", "Short-range prediction used a simple proportional step; the 30-minute prediction replaced it with an <b>exponential, non-linear term</b>, and scoring used mean error and image similarity."]}, "now": {"en": ["Here nothing is blurred into a grid: <b>every bubble is separated into its own object</b> — a population register rather than a density map.", "For detection, a brightness-threshold pipeline and a learning-based cell detector widely used in biology (Cellpose-SAM) were run side by side and compared.", "Detected bubbles become points, touching pairs become lines, and the resulting <b>neighbour network (a graph)</b> gives each bubble its neighbour count.", "The relationship between neighbour count and area change is then fitted with an estimate that a few extreme points cannot drag, to check whether the law’s coefficient really is positive.", "The decisive instrument is <b>hand-drawn ground truth</b>: 14 frames, roughly 1,000 bubbles marked one by one, used only for scoring.", "Confidence intervals were computed by <b>resampling whole bubbles</b>, because treating many measurements from the same bubble as independent inflates apparent significance.", "Several layers of automatic checks were installed that work regardless of whether the answer looks right — for instance a guard comparing the tracked bubble count <b>against an independently counted number</b>.", "To see whether a tiny minority of measurements was steering the line fit, the <b>fitting influence was broken out by strata</b>.", "The neural-network experiment was scored the strictest way available: <b>hold out an entire sample</b>, train without it, then test on it.", "Each of the <span class='num'>22</span> neighbour-swap events was checked by eye against a purpose-built <b>four-panel figure</b> (before, the swap, and two frames after) — a real swap keeps growing its new contact, while a glitch disappears after a single frame."]}}, {"num": "04", "name": {"en": "Results"}, "sub": {"en": "Every figure here is one the study itself reported."}, "plabel": null, "nlabel": null, "prior": {"en": ["From <b>just four observed frames two minutes apart</b>, the state 30 minutes later was predicted successfully.", "On the elongated specimen mean error fell from <span class='num'>0.222</span> to <span class='num'>0.205</span> as training progressed (about <span class='num'>20%</span> error).", "The similarity between predicted and real images climbed <b>towards 1.0, meaning identical</b>, as training repeated.", "The most striking result is generalisation — applied unchanged to the <b>circular specimen</b> never used in training, the error was <span class='num'>0.051</span>, about <span class='num'>5%</span>.", "That the error fell rather than rose when the specimen shape changed suggests the rule had not simply memorised particular images.", "The learned rule itself evolved interestingly — at first it caught only weak growth at a few spots.", "In the next stage it captured a regime of <b>widespread shrinkage almost everywhere</b>.", "With further training it found, on its own, a regime where <b>growing and shrinking regions coexist</b> — matching the stages real foam passes through.", "An asymmetry also emerged: at short range and short time the tendency to shrink dominates, reversing towards growth as the range widens.", "The authors' central claim is this — <b>without ever directly measuring the number of sides or the roundness</b>, the information index appears to carry that information in their place."]}, "now": {"en": ["The textbook law held in sign on all three samples: in all nine combinations the coefficient was positive and its confidence interval stayed clear of zero.", "On sample A the coefficient moved only from +0.367 to +0.358 — a 2% spread — while the measuring interval stretched twentyfold, from 30 to 600 seconds.", "Whether the coefficient drifts over a foam’s life is not settled: sample A’s apparent 1.5× rise appears with one fitting method but not when bubble size enters the fit, and apparent trends in samples C and F did not survive stricter tests.", "Five culprits behind the false failures were identified — tracking labels swallowing their neighbours, liquid channels mistaken for bubbles, an unstable background-separation threshold, a tiny minority of measurements exerting outsized influence, and a model trained on data that had already been discarded.", "The fourth is the most instructive — 1.2% of the measurements (86 out of 7,106) carried 48% of the fitting weight and dragged the coefficient from about +0.34 to +0.14, with an uncertainty range that crossed zero.", "Scored against the hand-made ground truth on sample A, the learning-based detector reached 0.966 and the older method 0.903 (1.0 is perfect).", "Neighbour count matters more, and there the learning-based detector’s average was within 0.03 of the truth while the older method over-counted by 0.60 — a result that overturned my own earlier assumption.", "The ground truth revealed something else: the mean neighbour count on this tray is <span class='num'>5.08</span>, so the “average of 6” long used as a success criterion was <b>unreachable from the start</b>.", "Bubble-count curves fell smoothly on all three samples (rank correlation −0.987 to −0.999), yet sample F created new identities mid-sequence amounting to 437% of the bubbles it began with.", "Neighbour-swap detection rose from <span class='num'>1 event to 22</span> once an inconsistency in the network was fixed, and <b>all 22 passed human verification</b> — zero false positives."]}}, {"num": "05", "name": {"en": "Implications"}, "sub": {"en": "What each study leaves behind for the world outside foam."}, "plabel": null, "nlabel": null, "prior": {"en": ["A demonstration that few observations can predict a distant future — four photographs sketch the state half an hour ahead.", "Because the discovered rule <b>arrives as an equation, people can inspect and contest it</b> — in science that matters as much as accuracy.", "It offers <b>a channel for injecting common-sense physics</b> (“small ones are absorbed by large ones”) into a computable form.", "By showing that laborious measurements — sides, roundness — can be bypassed, it opens a route to large-scale automation.", "Treating the wet and the dry state <b>within a single framework</b> fills a genuine gap in existing theory.", "That the rule evolves during training means it can be swapped for a better one as new data arrives.", "There is a direct line to processes that print foam patterns without costly templates, such as transparent electrodes.", "The same approach could <b>transfer to other systems partitioned into cells</b> — grain growth in metals, biological tissue.", "It sets machine learning and physics not against each other but as <b>a case of translating between their languages</b>.", "And practically — it establishes <b>a baseline</b> for what later work needs to verify more rigorously."]}, "now": {"en": ["By measuring head-on what the earlier study bypassed — the neighbour count itself — it tests numerically whether the textbook law holds in this system.", "Ground truth showed that the brightness-based pipeline was clearly less accurate than the learned detector for precise physical measurement.", "My failed neural-network experiment offers a possible explanation for the earlier study’s success — if the neighbour count already carries the useful information, a good proxy for it was enough.", "On that reading, the two results are not in conflict.", "Ground truth showed that the old target of “mean neighbour count 6” cannot hold on a finite raft, <b>retiring a mistaken success criterion</b>.", "It shows in concrete numbers <b>how fragile the most widely used line fit is to a handful of outliers</b> — 1.2% of the data steering 48% of the answer.", "The finding that “the counts look smooth while the identities have collapsed” is <b>a warning to every automatic tracking system</b>, not only to foam.", "Any study tracking a system divided into cells — metal grains, epithelial tissue, granular packings — can fall into the same trap.", "Keeping the negative results and the withdrawn claims on the record also makes the work easier to check.", "The output is therefore less a single paper than <b>a safety manual for the next researcher working on this system</b>."]}}, {"num": "06", "name": {"en": "Limitations"}, "sub": {"en": "What neither study can yet claim. The second one wrote this section at length about itself."}, "plabel": null, "nlabel": null, "prior": {"en": ["The prediction target is <b>the total inside a grid cell, not an individual bubble</b>, so the fate of any one bubble is unknowable.", "Because the number of sides is never measured directly, this study alone <b>cannot verify the textbook law itself</b>.", "The claim that the information index stands in for the side count rests on <b>two bubbles pointed at as examples</b>, not on statistical proof.", "The accuracy of bubble detection was <b>never scored against external ground truth</b>.", "Preprocessing leans on a fixed brightness value and “empirical conditions”, so it is unclear it would survive a change of lighting or specimen.", "The soap solution becomes more concentrated as water evaporates; the authors assume this does not change the overall evolution.", "Since bubbles are not tracked through time, <b>event-level analysis</b> — lifetimes, coalescence, neighbour swaps — <b>is impossible</b>.", "With effectively two specimens (one elongated, one circular), the statistical basis for generalisation is thin.", "A mean error of <span class='num'>20%</span> is fine for seeing a trend but leaves a lot of room to be called precise prediction.", "The headline errors are single values without error bars, although the spread of the error is reported for some results."]}, "now": {"en": ["Only <b>one of the three samples</b> has hand-made ground truth; detection accuracy on the other two is still unknown.", "Sample C's labels were made by deleting from the old detector's own output, so they cannot fairly score a different detector.", "Sample F has just <span class='num'>56</span> bubbles and wide confidence intervals, so it is reported but <b>not weighted equally</b>.", "Distance to the raft’s edge is unreliable on all three samples, because the automatic foam outline extends past the outermost bubbles onto the empty plate.", "The neural network beat the simple baseline in none of the nine combinations, and on two samples it <b>collapsed into answering “no change at all”</b>.", "Event-level analysis (coalescence, neighbour swaps) is <b>trustworthy only on sample A</b> — what blocks the rest is the tracker, not the detector.", "The <span class='num'>22</span> swaps are verified, but how they distribute over time cannot be read statistically: several time bins hold <b>only 0 to 2 events</b>.", "There is no spatial calibration, so the coefficient is in pixels² per second and the three samples’ magnitudes cannot be compared directly.", "Relaxing the contact criterion slightly raises the count to 35 or 60 events, depending on the setting, which means the current threshold may be missing real ones.", "The most honest limitation is this — the project established what was wrong with the measurements, but added no new predictive power."]}}, {"num": "07", "name": {"en": "Next steps"}, "sub": {"en": "The homework each study leaves, and the path that appears when the two are joined."}, "plabel": {"en": "Open questions after the prior study"}, "nlabel": {"en": "Next steps for this study"}, "prior": {"en": ["Put the edge-first drying of water back in <b>as a value that varies across space</b> rather than ignoring it.", "Compare performance while varying how neighbours are weighted (something other than the bell shape).", "Increase the number of specimens and conditions to test statistically whether the rule is truly general.", "Refine the grid until prediction resolution reaches <b>the level of a single bubble</b>.", "Measure directly how much liquid remains and add it as an input variable.", "Make the model <b>emit an uncertainty range alongside each prediction</b>.", "Score the accuracy of the detection step against external ground truth — <b>exactly where this study began</b>.", "Track bubbles through time to make event-level analysis possible — again, something this study took up.", "Connect the rule to the control signals of a real printing or patterning process.", "Map the learned rule <b>term by term</b> onto the existing physical theory."]}, "now": {"en": ["The most urgent task is <b>hand-made ground truth for the other two samples</b> — without scoring, comparison does not stand.", "Settle whether the contact threshold is too strict: the 16 extra events found when it is relaxed showed no flicker when scored by eye.", "Fix the tracker so bubble identity survives on samples C and F — that is the present bottleneck.", "Publishing a neighbour-swap rate needs far longer footage, enough to raise the event count <b>by an order of magnitude or two</b>.", "Once per-bubble identity is secured, lifetime distributions and coalescence events become tractable for the first time.", "And here the two studies meet — <b>retrain the earlier study's predictive rule on top of the detector validated on sample A</b>.", "That would test whether the information index really stands in for the side count, <b>as statistics over thousands of bubbles</b> rather than as two examples.", "The prediction target could also be raised from a grid-cell total to <b>the area change of an individual bubble</b>.", "If the neighbour count is sufficient, the next model should not add more structure but add <b>physical quantities not yet measured</b> — wetness, film thickness.", "Finally, the greatest reach would come from <b>extracting the automatic checks built here as standalone tools</b> for other tracking studies to use."]}}, {"num": "08", "name": {"en": "Background"}, "sub": {"en": "Worth knowing before the talk. No specialist knowledge required."}, "plabel": {"en": "What the prior study needs you to know"}, "nlabel": {"en": "What this study needs you to know"}, "prior": {"en": ["A <b>2D bubble raft</b> is foam pressed between glass plates into a single layer — far easier to observe and compute than a three-dimensional mass of foam.", "Foam changes for a simple reason: <b>a tendency to reduce the total area of soap film</b>. It is why a soap bubble is round.", "Gas seeps through the thin films <b>from small bubbles into large ones</b>, so the small ones vanish and the large ones grow.", "The statement of this process is <b>von Neumann's law</b>: a short equation saying area changes in proportion to the neighbour count minus six.", "Why six? Soap films meet in threes at 120°. With those angles a six-sided bubble can have straight walls; fewer sides force its walls to bulge outward, raising its pressure so it loses gas, while more sides do the reverse.", "But that “average of six” assumes <b>an endlessly wide plane</b> — precisely the point this study takes up.", "Wet foam differs from dry: in wet foam <b>thick channels of pooled water</b> form between the films, blurring the clean law.", "So a more complicated equation exists for wet foam, carrying each bubble’s roundness, the gap between the plates and the size of the liquid borders.", "The field is historically active because the bubble raft was originally devised as <b>a model for how crystal grains grow inside metal</b>.", "The “convolution” in the earlier study is not difficult — it is <b>a weighted average of nearby values, blended into one</b>, the same arithmetic as the blur filter in a photo app."]}, "now": {"en": ["A <b>graph</b> is a map of relationships drawn as points and lines — put a point on each bubble and a line between touching ones and you get something like a subway map.", "A <b>graph neural network (GNN)</b> learns by passing information between neighbours on that map — the same family of technique as friend suggestions on social networks.", "<b>Segmentation</b> is the job of carving each bubble's boundary out of a photograph so they become separate objects.", "The Cellpose-SAM tool used here was built to outline cells in microscope images, yet it worked well on foam without any foam-specific training.", "Detection quality is read two ways — <b>precision</b> (of what it claimed, how much was real) and <b>recall</b> (of what was real, how much it found) — plus a combined score where 1.0 is perfect.", "A <b>confidence interval</b> is the range a value can reasonably be said to lie in; when that range stays clear of zero, chance becomes hard to blame.", "Line fitting has a habit of <b>being dragged by a few far-flung points</b> — like one person on the end of a seesaw outweighing several near the middle.", "<b>Tracking</b> means deciding, frame after frame, whether this bubble is the same bubble as before — an entirely different problem from counting them.", "A <b>neighbour swap (T1)</b> is a change of partners: two touching bubbles separate while two others beside them come into contact, rather like people brushing past each other in a crowd and swapping places.", "Finally, a sufficient statistic — the idea that everything needed to determine an outcome is already contained in one number. This study suggests that in this foam, for predicting area change, the neighbour count may be that number."]}}], "figure": {"cap": {"en": "The one rule both studies stand on — six neighbours is the break-even point. A bubble with fewer loses gas to its neighbours and shrinks; one with more gains and grows. This is the rule the second study tested, and the rule the first study reached without ever measuring it directly."}, "labels": {"en": ["5 neighbours", "6 neighbours", "7 neighbours", "shrinks", "steady", "grows"]}}, "bridge": {"lbl": {"en": "What connects the two"}, "p": {"en": "Both studies share what is effectively the same experiment — flat soap foam pressed between glass plates, photographed every 10 to 30 seconds. They read most naturally not as two competing hypotheses but as two stages laid out in order on one bench. The earlier work showed that prediction is possible; this work relaid the measurement floor that prediction stands on."}}, "footer": {"en": "Sources — Prior study: In Ho Cho, Sinchul Yeom, Tanmoy Sarkar, Tae-Sik Oh, “Unraveling hidden rules behind the wet-to-dry transition of bubble array by glass-box physics rule learner”, <i>Scientific Reports</i> 12:3191 (2022). This study: Jongwoo Lee’s analysis of three foams recorded in Dr. Oh’s lab (2026).<br>Figures are as each source reports them; the comparison between the two studies was written for this page."}}, "deck": {"ui": {"hint": {"en": "← → or swipe"}, "prev": {"en": "Previous slide"}, "next": {"en": "Next slide"}, "goto": {"en": "Go to slide"}}, "slides": [{"chip": {"en": "01 / The stage"}, "h1": {"en": "One tray of bubbles,<br><span class='hp'>two studies</span>, <span class='hl'>two different questions</span>"}, "sub": {"en": "Soap foam pressed between two glass plates loses its <b>small bubbles while the large ones grow</b>. The deciding factor is the neighbour count — fewer than six and a bubble loses gas, more than six and it gains."}, "figtitle": {"en": "Figure 1 · Coarsening simulation"}, "legend": {"en": ["&gt; 6 · grows", "&lt; 6 · shrinks", "= 6 · steady"]}, "figfoot": {"en": "The number inside each circle is that bubble's <b>current neighbour count</b>. When a neighbour disappears the counts around it change, so a bubble that was growing can start to shrink."}, "qp": {"k": {"en": "Prior study · 2022"}, "t": {"en": "“Can we predict what happens next?”"}, "g": {"en": "Four photographs, 30 minutes ahead"}}, "qn": {"k": {"en": "This study · 2026"}, "t": {"en": "“Are we measuring the right thing?”"}, "g": {"en": "Testing the law itself, numerically"}}}, {"chip": {"en": "02 / Method"}, "h1": {"en": "Same photograph — read it as a <span class='hp'>density map</span><br>or as a <span class='hl'>population register</span>?"}, "sub": {"en": "The two studies part ways at the first step — turning a photograph into numbers. <b>The left never counts bubbles, only district totals</b>; <b>the right separates every bubble and links its neighbours.</b>"}, "figtitleP": {"en": "Prior study · fixed grid + information index"}, "figfootP": {"en": "Rather than chasing bubbles, a <b>grid that never moves</b> is laid over the frame, and each cell is summarised by one number: is this a place that will grow or shrink? The side count is never measured."}, "figtitleN": {"en": "This study · segmentation + neighbour graph"}, "figfootN": {"en": "Each bubble's boundary is carved out into a <b>separate object</b>, touching pairs are linked, and <b>the neighbours are counted directly</b> — the law cannot be tested without that number."}}, {"chip": {"en": "03 / Results"}, "h1": {"en": "The apparent failures came from the measurement, not the law"}, "sub": {"en": "86 measurements — 1.2% of the total — carried 48% of a least-squares fit and dragged K from +0.34 to +0.14, with an uncertainty range crossing zero. The figure replays that."}, "figtitle": {"en": "Figure 2 · How a few outliers drag the line"}, "axisX": {"en": "neighbours − 6  →"}, "axisY": {"en": "← area change"}, "caps": {"en": ["Normal measurements — more neighbours, more growth, exactly as the law says", "86 giant flickering bubbles enter the fit (1.2% of the data)", "The line flattens — K falls to +0.14 and can no longer be told apart from zero", "Remove the outliers…", "The line returns — the measurement moved, not the physics"]}, "tiles": [{"v": "9", "suffix": " / 9", "dec": 0, "prefix": "", "k": {"en": "<b>K is positive in every cell</b><br>confidence intervals clear of zero"}}, {"v": "2", "suffix": "%", "dec": 0, "prefix": "±", "k": {"en": "Foam A: a twentyfold longer interval<br>moves K by just 2%"}}, {"v": "0.60", "suffix": "", "dec": 2, "prefix": "+", "warn": true, "k": {"en": "Neighbours <b>over-counted by the old detector</b><br>(the learned one: +0.03)"}}, {"v": "22", "suffix": "", "dec": 0, "prefix": "1 → ", "k": {"en": "<b>Neighbour swaps detected</b><br>all 22 verified by eye"}}], "verdict": {"en": "The prior study succeeded at prediction by going around the side count; this study measures it directly, tests the law, and offers a reason the detour worked — the answer was already contained in that one number, the neighbour count."}}]}};

function rnd(a,b){ return a + Math.random()*(b-a); }

var S1 = (function(){
  var o = setup("c1"); if(!o) return {step:function(){}};
  var bub = [], seeded = false, M = 10;
  function seed(){
    bub = [];
    var n = Math.max(30, Math.min(85, Math.round(o.w*o.h/8200)));
    for(var i=0;i<n;i++) bub.push({x:rnd(M+24,o.w-M-24), y:rnd(M+24,o.h-M-24), r:rnd(10,26), n:6});
    seeded = true;
  }
  o.onresize = function(){ if(o.w>0) seed(); };
  function neighbors(){
    var i,j;
    for(i=0;i<bub.length;i++) bub[i].n = 0;
    for(i=0;i<bub.length;i++) for(j=i+1;j<bub.length;j++){
      var a=bub[i], b=bub[j], dx=b.x-a.x, dy=b.y-a.y;
      if(Math.sqrt(dx*dx+dy*dy) < a.r+b.r+7){ a.n++; b.n++; }

    var k,i,j;

      for(i=0;i<bub.length;i++) for(j=i+1;j<bub.length;j++){
        var a=bub[i], b=bub[j], dx=b.x-a.x, dy=b.y-a.y;
        var d = Math.sqrt(dx*dx+dy*dy)||0.01, ov = (a.r+b.r) - d;
        if(ov > 0){ var ux=dx/d, uy=dy/d, s=ov*0.22; a.x-=ux*s; a.y-=uy*s; b.x+=ux*s; b.y+=uy*s; }
      }
      for(i=0;i<bub.length;i++){
        var c = bub[i];
        c.x = Math.max(c.r+M, Math.min(o.w-c.r-M, c.x));
        c.y = Math.max(c.r+M, Math.min(o.h-c.r-M, c.y));

  }

  function step(dt, active){
    if(o.w < 1) return;

    var ctx = o.ctx, i;
    ctx.clearRect(0,0,o.w,o.h);
    if(active && !REDUCED){
      acc += dt;

          var b = bub[i];

        if(bub.length < 20){ seed(); neighbors(); }
      }
    }
    for(i=0;i<bub.length;i++){
      var b2 = bub[i];
      var col = b2.n>6 ? C.now : (b2.n<6 ? C.warn : C.ink3);
      ctx.fillStyle = "rgba(255,255,255,0.022)";

function makeField(w,h,count){
  var f = [], tries = 0;
  while(f.length < count && tries < count*80){
    tries++;
    var r = rnd(11,26), x = rnd(r+10, w-r-10), y = rnd(r+10, h-r-10), ok = true;
    for(var i=0;i<f.length;i++){
      var dx=f[i].x-x, dy=f[i].y-y;
      if(Math.sqrt(dx*dx+dy*dy) < f[i].r+r+1){ ok=false; break; }
    }
    if(ok) f.push({x:x,y:y,r:r});
  }
  return f;
}

var S2A = (function(){
  var o = setup("c2a"); if(!o) return {step:function(){}};
  var field = [], cells = [], CW=0, CH=0, t=0;
  o.onresize = function(){
    if(o.w < 1) return;
    field = makeField(o.w, o.h, Math.max(10, Math.round(o.w*o.h/3200)));
    var cols = Math.max(4, Math.round(o.w/52)), rows = Math.max(3, Math.round(o.h/52));
    CW = o.w/cols; CH = o.h/rows; cells = [];
    var r,c,i,mx=1;
    for(r=0;r<rows;r++) for(c=0;c<cols;c++){
      var cx=c*CW+CW/2, cy=r*CH+CH/2, sum=0;
      for(i=0;i<field.length;i++){
        var b=field[i], dx=b.x-cx, dy=b.y-cy;
        sum += Math.exp(-(dx*dx+dy*dy)/9800) * (2*Math.PI*b.r) * (b.r>18?1:-0.8);
      }
      cells.push({x:c*CW, y:r*CH, v:sum, order:(c/cols*0.55 + r/rows*0.45)});
    }
    for(i=0;i<cells.length;i++) mx = Math.max(mx, Math.abs(cells[i].v));
    for(i=0;i<cells.length;i++) cells[i].v /= mx;
  };
  o.onresize();
  function step(dt, active){
    if(o.w < 1) return;
    var ctx = o.ctx, i;
    if(active && !REDUCED){ t += dt*0.32; if(t > 1.7) t = 0; } else t = 1.0;
    ctx.clearRect(0,0,o.w,o.h);
    for(i=0;i<field.length;i++){
      var b = field[i];
      ctx.strokeStyle = "rgba(159,176,172,0.15)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832); ctx.stroke();
    }
    var reveal = Math.min(1, t/0.75);
    for(i=0;i<cells.length;i++){
      var cl = cells[i], p = (reveal - cl.order*0.85)/0.26;
      if(p <= 0) continue;
      p = Math.min(1, p);
      var a = Math.min(0.55, Math.abs(cl.v))*p;
      ctx.fillStyle = cl.v >= 0 ? "rgba(163,156,240,"+a.toFixed(3)+")" : "rgba(232,148,92,"+(a*0.8).toFixed(3)+")";
      ctx.fillRect(cl.x+1, cl.y+1, CW-2, CH-2);
      ctx.strokeStyle = "rgba(163,156,240,"+(0.16*p).toFixed(3)+")"; ctx.lineWidth = 1;
      ctx.strokeRect(cl.x+0.5, cl.y+0.5, CW-1, CH-1);
    }
  }
  return {step:step};
})();

var S2B = (function(){
  var o = setup("c2b"); if(!o) return {step:function(){}};
  var field = [], edges = [], t = 0;
  o.onresize = function(){
    if(o.w < 1) return;
    field = makeField(o.w, o.h, Math.max(10, Math.round(o.w*o.h/3200)));
    field.forEach(function(b,i){ b.order = i/Math.max(1,field.length-1); b.n = 0; });
    edges = [];
    var i,j;
    for(i=0;i<field.length;i++) for(j=i+1;j<field.length;j++){
      var a=field[i], b=field[j], dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d < a.r+b.r+13){ edges.push({a:a,b:b,d:d}); a.n++; b.n++; }
    }
    edges.sort(function(p,q){ return p.d-q.d; });
    edges.forEach(function(e,k){ e.order = k/Math.max(1,edges.length-1); });
  };
  o.onresize();
  function step(dt, active){
    if(o.w < 1) return;
    var ctx = o.ctx, i;
    if(active && !REDUCED){ t += dt*0.32; if(t > 1.7) t = 0; } else t = 1.0;
    ctx.clearRect(0,0,o.w,o.h);
    var pOut = Math.min(1, t/0.30);
    for(i=0;i<field.length;i++){
      var b = field[i], p = Math.min(1, Math.max(0, (pOut - b.order*0.85)/0.2));
      if(p<=0) continue;

      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832); ctx.fill();
      ctx.strokeStyle = "rgba(79,198,174,"+(0.55*p).toFixed(3)+")"; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832); ctx.stroke();
    }
    var pE = Math.min(1, Math.max(0,(t-0.34))/0.34);

      var e = edges[i], p2 = Math.min(1, Math.max(0,(pE - e.order*0.8)/0.22));
      if(p2<=0) continue;

      ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y);
      ctx.lineTo(e.a.x+(e.b.x-e.a.x)*p2, e.a.y+(e.b.y-e.a.y)*p2); ctx.stroke();

        }
      }
    }

})();

var S3 = (function(){
  var o = setup("c3");
  var kEl = document.getElementById("kread"), capEl = document.getElementById("cap3");
  if(!o) return {step:function(){}, reset:function(){}, recap:function(){}};
  var pts = [], out = [], t = 0, PAD = {l:52, r:20, t:18, b:34}, lastCap = -1;
  (function build(){
    var i;
    for(i=0;i<340;i++){
      var xi = Math.round(rnd(-3.4,3.4));
      pts.push({x: xi + rnd(-0.22,0.22), y: 0.34*xi + rnd(-0.9,0.9)});
    }
    for(i=0;i<86;i++){ var s = Math.random()<0.5 ? -1 : 1, ax = s*rnd(6.2,8.4);
      out.push({x:ax, y:-0.12*ax + rnd(-1.4,1.4)}); }
  })();
  function X(v){ return PAD.l + (v+9.5)/19 * (o.w-PAD.l-PAD.r); }
  function Y(v){ return PAD.t + (5.6-v)/11.2 * (o.h-PAD.t-PAD.b); }
  function ease(p){ return p<0 ? 0 : p>1 ? 1 : p*p*(3-2*p); }

    if(t < 3.3) return 0; if(t < 4.6) return 1; if(t < 7.2) return 2; if(t < 8.6) return 3; return 4;
  }
  function recap(){ lastCap = -1; }
  function step(dt, active){
    if(o.w < 1) return;
    var ctx = o.ctx, i;
    if(active && !REDUCED){ t += dt; if(t > 11.0) t = 0; } else t = 2.4;
    ctx.clearRect(0,0,o.w,o.h);
    ctx.strokeStyle = "#22302E"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, Y(0)); ctx.lineTo(o.w-PAD.r, Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), PAD.t); ctx.lineTo(X(0), o.h-PAD.b); ctx.stroke();
    ctx.fillStyle = C.ink3; ctx.font = '400 10.5px LatinMono, LatinBody, sans-serif';
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText(DATA.deck.slides[2].axisX[LANG], o.w-PAD.r, Y(0)+7);
    ctx.save(); ctx.translate(PAD.l-14, PAD.t+4); ctx.rotate(-Math.PI/2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(DATA.deck.slides[2].axisY[LANG], 0, 0); ctx.restore();
    for(i=0;i<pts.length;i++){
      var p = pts[i], a = 0.42*ease((t - i/pts.length*1.1)/0.5);
      if(a<=0) continue;
      ctx.fillStyle = "rgba(79,198,174,"+a.toFixed(3)+")";
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 2.3, 0, 6.2832); ctx.fill();
    }
    var outA = Math.max(0, ease((t-3.3)/1.0) - ease((t-7.2)/1.0));
    if(outA > 0){
      for(i=0;i<out.length;i++){
        var q = out[i];
        ctx.fillStyle = "rgba(232,148,92,"+(0.85*outA).toFixed(3)+")";
        ctx.beginPath(); ctx.arc(X(q.x), Y(q.y), 3+2.6*outA, 0, 6.2832); ctx.fill();
      }

    ctx.strokeStyle = (outA>0.5 ? "rgba(232,148,92," : "rgba(79,198,174,") + lineA + ")";
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(X(-9.2), Y(slope*-9.2)); ctx.lineTo(X(9.2), Y(slope*9.2)); ctx.stroke();
    if(kEl){
      kEl.textContent = "K = " + (slope>=0?"+":"") + slope.toFixed(2);
      kEl.classList.toggle("flip", outA>0.5);
    }
    var ph = phase();
    if(capEl && ph !== lastCap){ capEl.innerHTML = DATA.deck.slides[2].caps[LANG][ph]; lastCap = ph; }
  }
  return {step:step, reset:function(){ t = 0; recap(); }, recap:recap};
})();

function runCounters(root){
  Array.prototype.forEach.call(root.querySelectorAll("[data-count]"), function(el){
    var target = parseFloat(el.getAttribute("data-count"));
    var dec = parseInt(el.getAttribute("data-dec")||"0",10);
    var pre = el.getAttribute("data-prefix")||"", suf = el.getAttribute("data-suffix")||"";
    if(REDUCED){ el.textContent = pre+target.toFixed(dec)+suf; return; }
    var t0 = performance.now();
    (function tick(now){
      var p = Math.min(1,(now-t0)/1050), e = 1-Math.pow(1-p,3);
      el.textContent = pre + (target*e).toFixed(dec) + suf;
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  });
}


var LANG = "en", MODE = "doc";
var T = {
  en:{title:"Two Questions on a Bubble Tray", doc:"Document", deck:"Slides",
      brandDoc:"Bubble raft · two studies", brandDeck:"Two questions on a bubble tray"}
};
function $(id){ return document.getElementById(id); }
function setHTML(id,v){ var e=$(id); if(e) e.innerHTML=v; }

/* ---------- document ---------- */
function renderDoc(){
  var D = DATA.doc, L = LANG, m = D.meta;
  setHTML("d_eyebrow", m.eyebrow[L]);
  setHTML("d_h1", m.h1[L]);
  setHTML("d_lede", m.lede[L]);
  setHTML("d_pc_tag", m.cardP.tag[L]); setHTML("d_pc_who", m.cardP.who[L]); setHTML("d_pc_q", m.cardP.q[L]);
  setHTML("d_nc_tag", m.cardN.tag[L]); setHTML("d_nc_who", m.cardN.who[L]); setHTML("d_nc_q", m.cardN.q[L]);
  setHTML("d_footer", D.footer[L]);

  var nav = m.nav[L].map(function(n,i){ return '<a href="#s'+(i+1)+'">'+n+'</a>'; }).join("");
  setHTML("dnav", nav);

  var out = "";
  D.sections.forEach(function(s, i){
    var plab = s.plabel ? s.plabel[L] : m.labelP[L];
    var nlab = s.nlabel ? s.nlabel[L] : m.labelN[L];
    var fig = (i === 7) ? SVG_MARKUP : "";
    out += '<section class="block" id="s'+(i+1)+'"><div class="wrap">'
      + '<div class="sec-head"><span class="sec-num">'+s.num+'</span><h2>'+s.name[L]+'</h2></div>'
      + '<p class="sec-sub">'+s.sub[L]+'</p>'
      + fig
      + '<div class="cols">'
      + '<div class="col p"><span class="col-tag"><span class="dot"></span>'+plab+'</span><ol class="ten">'
      + s.prior[L].map(function(t){ return "<li>"+t+"</li>"; }).join("")
      + '</ol></div>'
      + '<div class="col n"><span class="col-tag"><span class="dot"></span>'+nlab+'</span><ol class="ten">'
      + s.now[L].map(function(t){ return "<li>"+t+"</li>"; }).join("")
      + '</ol></div></div>';
    if(i === 0){
      out += '<div class="bridge"><span class="lbl">'+D.bridge.lbl[L]+'</span><p>'+D.bridge.p[L]+'</p></div>';
    }
    out += '</div></section>';
  });
  setHTML("d_sections", out);
  var f = $("d_figcap"); if(f) f.innerHTML = D.figure.cap[L];
  D.figure.labels[L].forEach(function(t,i){ var e = $("svg_l"+i); if(e) e.textContent = t; });
}

/* ---------- deck text ---------- */
function pick(path){
  var D = DATA.deck, parts = path.split(".");
  if(parts[0] === "ui") return D.ui[parts[1]][LANG];
  var s = D.slides[parseInt(parts[0].substring(1),10)];
  if(parts[1].indexOf("lg") === 0) return s.legend[LANG][parseInt(parts[1].substring(2),10)];
  var node = s;
  for(var i=1;i<parts.length;i++) node = node[parts[i]];
  return node[LANG];
}
function renderDeckText(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(el){
    var v = pick(el.getAttribute("data-t"));
    var keep = el.querySelector(".qg");
    if(keep){ el.innerHTML = v; el.appendChild(keep); }
    else el.innerHTML = v;
  });
  var tiles = DATA.deck.slides[2].tiles;
  $("tiles").innerHTML = tiles.map(function(t){
    return '<div class="tile"><div class="tv'+(t.warn?" warnv":"")+'" data-count="'+t.v+'" data-dec="'+t.dec+'" data-prefix="'+t.prefix+'" data-suffix="'+t.suffix+'">'
      + t.prefix + (0).toFixed(t.dec) + t.suffix + '</div><div class="tk">'+t.k[LANG]+'</div></div>';
  }).join("");
  $("prev").setAttribute("aria-label", DATA.deck.ui.prev[LANG]);
  $("next").setAttribute("aria-label", DATA.deck.ui.next[LANG]);
  S3.recap();
}


/* ---------- deck navigation ---------- */
var slides = [$("sl1"), $("sl2"), $("sl3")], idx = 0, dotsWrap = $("dots");
slides.forEach(function(s,i){
  var b = document.createElement("button");
  b.setAttribute("aria-label", (i+1) + " " + DATA.deck.ui.goto[LANG]);
  b.addEventListener("click", function(e){ e.stopPropagation(); go(i); });
  dotsWrap.appendChild(b);
});
function go(i){
  idx = (i+slides.length)%slides.length;
  slides.forEach(function(s,k){ s.classList.toggle("on", k===idx); if(k===idx) s.scrollTop = 0; });
  Array.prototype.forEach.call(dotsWrap.children, function(b,k){ b.setAttribute("aria-current", k===idx?"true":"false"); });
  $("cnum").textContent = String(idx+1);
  if(idx===2){ S3.reset(); runCounters(slides[2]); }
}
$("next").addEventListener("click", function(e){ e.stopPropagation(); go(idx+1); });
$("prev").addEventListener("click", function(e){ e.stopPropagation(); go(idx-1); });
window.addEventListener("keydown", function(e){
  if(MODE !== "deck") return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); go(idx+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(idx-1); }
});
var deckEl = $("deck");
var finePointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
deckEl.addEventListener("click", function(e){
  if(!finePointer || e.target.closest(".controls")) return;
  go(e.clientX/window.innerWidth < 0.28 ? idx-1 : idx+1);
});
var sx=0, sy=0, tracking=false;
deckEl.addEventListener("touchstart", function(e){
  if(e.touches.length!==1 || e.target.closest(".controls")){ tracking=false; return; }
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true;
}, {passive:true});
deckEl.addEventListener("touchend", function(e){
  if(!tracking) return; tracking=false;
  var tt=e.changedTouches[0], dx=tt.clientX-sx, dy=tt.clientY-sy;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0 ? idx+1 : idx-1);
}, {passive:true});

/* ---------- mode + language ---------- */
function applyMode(){
  var deck = MODE === "deck";
  document.body.classList.toggle("mode-deck", deck);
  $("viewDoc").classList.toggle("on", !deck);
  $("viewDeck").classList.toggle("on", deck);
  $("bDoc").setAttribute("aria-pressed", String(!deck));
  $("bDeck").setAttribute("aria-pressed", String(deck));
  $("brand").textContent = deck ? T[LANG].brandDeck : T[LANG].brandDoc;
  if(deck){
    [S1,S2A,S2B,S3].forEach(function(s){ if(s && s.resize) s.resize(); });
    window.dispatchEvent(new Event("resize"));
    go(idx);
  }
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = T[LANG].title;
  $("bDoc").textContent = T[LANG].doc;
  $("bDeck").textContent = T[LANG].deck;
  renderDoc();
  renderDeckText();
  Array.prototype.forEach.call(dotsWrap.children, function(b,k){
    b.setAttribute("aria-label", (k+1) + " " + DATA.deck.ui.goto[LANG]);
  });
  if(MODE === "deck" && idx === 2) runCounters(slides[2]);
  $("brand").textContent = MODE === "deck" ? T[LANG].brandDeck : T[LANG].brandDoc;
}
$("bDoc").addEventListener("click", function(){ MODE="doc"; applyMode(); });
$("bDeck").addEventListener("click", function(){ MODE="deck"; applyMode(); });

/* ---------- boot ---------- */
applyLang();
applyMode();
go(0);
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05,(now-last)/1000); last = now;
  var deck = MODE === "deck";
  S1.step(dt, deck && idx===0);
  S2A.step(dt, deck && idx===1);
  S2B.step(dt, deck && idx===1);
  S3.step(dt, deck && idx===2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
